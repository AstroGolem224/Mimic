# Eigene Umgebung, dritte in spike2/. Grund wie bei moss/ und chatterbox/.
#
# `qwen-tts` bringt seine eigene transformers-Obergrenze mit und vertraegt sich
# deshalb nicht mit der MOSS-Umgebung (transformers==5.0.0). Die Obergrenze
# 4.57.6 ist von voicebox uebernommen (backend/requirements.txt:14) und dort
# gegen alle Qwen-Pfade gelaufen.
#
#   uv sync --python 3.12
#
[project]
name = "spike2-qwen"
version = "0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "transformers>=4.36.0,<=4.57.6",
    "accelerate",
    "qwen-tts>=0.0.5",
    # Ohne diese zwei Zeilen loest uv librosa auf numba 0.53 / llvmlite 0.36
    # zurueck und scheitert dann am Build von llvmlite. Dieselben Pins wie in
    # chatterbox/ -- aus demselben Grund und mit demselben Vorbehalt.
    "numpy>=1.26,<2.0",
    "numba>=0.60.0,<0.61.0",
    "librosa",
    "soundfile",
    "pyyaml",
    "huggingface_hub",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
