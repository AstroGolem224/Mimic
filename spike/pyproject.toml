[project]
name = "mimic-spike"
version = "0"
description = "Phase-0-Spike: dots.tts auf RTX 5090 / sm_120. Wegwerfcode, wird nicht Teil des Dienstes."
requires-python = ">=3.12,<3.13"
dependencies = [
    "dots-tts==0.2.1",
    # Upstream constraints/recommended.txt pinnt torch==2.8.0 / torchaudio==2.8.0.
    # Overlay: dieselbe Version, cu128-Build. Der Default-PyPI-Wheel waere cu12.6
    # und hat keine sm_120-Kernel -> stiller CPU-Fallback statt Fehler.
    "torch==2.8.0",
    "torchaudio==2.8.0",
    # Rest verbatim aus constraints/recommended.txt.
    "transformers==4.57.0",
    "librosa==0.11.0",
    "soundfile==0.13.1",
    "numpy==2.2.6",
    "pydantic==2.12.5",
    "pyyaml==6.0.3",
    "safetensors==0.8.0rc0",
]

[tool.uv]
# Erlaubt safetensors==0.8.0rc0 aus den Upstream-Constraints.
prerelease = "allow"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
